# Rootly WAF - custom ModSecurity rules (initially empty)
# Add project-specific rules here, e.g. rate limiting or allowlists.

# Example rule template (disabled):
# SecRule REQUEST_HEADERS:User-Agent "evil-bot" "id:1000001,phase:1,deny,status:403,msg:'Blocked known bad bot'"

# Initialize IP collection for custom counters and auto-bans
SecAction \
  "id:1000099,\
   phase:1,\
   pass,\
   nolog,\
   initcol:ip=%{REMOTE_ADDR}"

# Allow whitelist addresses (skip remaining rules)
SecRule REMOTE_ADDR "@ipMatchFromFile /etc/nginx/modsec/ip-whitelist.conf" \
  "id:1000102,\
   phase:1,\
   nolog,\
   allow,\
   ctl:ruleEngine=Off"

# Block blacklist addresses immediately
SecRule REMOTE_ADDR "@ipMatchFromFile /etc/nginx/modsec/ip-blacklist.conf" \
  "id:1000103,\
   phase:1,\
   deny,\
   status:403,\
   log,\
   msg:'Solicitud bloqueada: IP en lista negra'"

# Deny IPs previously marcadas como maliciosas
SecRule IP:BLOCKED "@eq 1" \
  "id:1000104,\
   phase:1,\
   deny,\
   status:403,\
   log,\
   msg:'Solicitud bloqueada: IP marcada como maliciosa'"

# Enable basic DoS protection (low thresholds for testing)
SecAction \
  "id:900700,\
   phase:1,\
   pass,\
   nolog,\
   t:none,\
   setvar:tx.dos_burst_time_slice=10,\
   setvar:tx.dos_threshold=200,\
   setvar:tx.dos_block_timeout=600"

# Auto-bloqueo de IP si excede el puntaje de anomalía del CRS
SecRule TX:ANOMALY_SCORE "@ge 15" \
  "id:1000200,\
   phase:2,\
   log,\
   msg:'IP marcada por puntaje de anomalía elevado; aplicando auto-bloqueo',\
   setvar:ip.blocked=1,\
   expirevar:ip.blocked=3600,\
   deny,\
   status:403"

# Rate-limit POST /api/v1/auth/login to prevent brute force attacks
SecRule REQUEST_URI "@beginsWith /api/v1/auth/login" \
  "id:1000100,\
   phase:2,\
   pass,\
   nolog,\
   t:none,\
   chain"
  SecRule REQUEST_METHOD "@streq POST" \
    "t:none,\
     setvar:ip.auth_login_counter=+1,\
     expirevar:ip.auth_login_counter=60"

SecRule IP:AUTH_LOGIN_COUNTER "@gt 10" \
  "id:1000101,\
   phase:2,\
   deny,\
   status:429,\
   log,\
   setvar:ip.blocked=1,\
   expirevar:ip.blocked=600,\
   msg:'Demasiados intentos de login desde esta IP'"

# Rate-limit plant photo uploads (POST /api/v1/plants/{uuid}/photo)
SecRule REQUEST_URI "@rx ^/api/v1/plants/[0-9a-fA-F\\-]+/photo$" \
  "id:1000110,\
   phase:2,\
   pass,\
   nolog,\
   t:none,\
   chain"
  SecRule REQUEST_METHOD "@streq POST" \
    "t:none,\
     setvar:ip.plant_photo_upload_counter=+1,\
     expirevar:ip.plant_photo_upload_counter=120"

SecRule IP:PLANT_PHOTO_UPLOAD_COUNTER "@gt 6" \
  "id:1000111,\
   phase:2,\
   deny,\
   status:429,\
   log,\
   setvar:ip.blocked=1,\
   expirevar:ip.blocked=900,\
   msg:'Exceso de subidas de fotos de plantas desde esta IP'"

# Rate-limit plant creation (POST /api/v1/plants)
SecRule REQUEST_URI "@rx ^/api/v1/plants/?$" \
  "id:1000120,\
