# Excepciones para operaciones DELETE permitidas
# Excepciones para operaciones DELETE y PUT permitidas
SecRule REQUEST_METHOD "@within DELETE PUT" \
  "id:1000300,\
   phase:1,\
   pass,\
   nolog,\
   ctl:ruleRemoveById=911100,\
   ctl:ruleRemoveById=949110"

