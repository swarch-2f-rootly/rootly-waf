load_module modules/ngx_http_modsecurity_module.so;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    modsecurity on;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    tcp_nodelay on;
    server_tokens off;

    limit_req_zone $binary_remote_addr zone=global_api:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=sensors_zone:5m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=devices_zone:5m rate=8r/s;
    limit_req_zone $binary_remote_addr zone=plants_zone:5m rate=8r/s;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    include /etc/nginx/conf.d/*.conf;
}

